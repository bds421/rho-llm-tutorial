name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet all modules
        run: make vet-all

      - name: Build all tutorials
        run: make build-all

      - name: Run offline race tests
        run: make test-stress test-food
