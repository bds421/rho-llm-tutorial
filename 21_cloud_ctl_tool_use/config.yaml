report_dir: "reports"

# Model IDs must match the rho/llm registry exactly (see rho/llm/registry.go).
#
# Fields:
#   provider:        rho/llm provider name (anthropic, gemini, xai, ollama, ...)
#   model:           exact registry ID
#   api_key_env:     env var holding the API key -- model is skipped if unset/empty
#   base_url:        optional endpoint override
#   timeout_seconds: per-request deadline (default: 180 for tool use)

models:

  # ---------------------------------------------------------------------------
  # Anthropic  (ANTHROPIC_API_KEY)
  # ---------------------------------------------------------------------------
  - provider: "anthropic"
    model: "claude-haiku-4-5-20251001"
    api_key_env: "ANTHROPIC_API_KEY"
    timeout_seconds: 180
  - provider: "anthropic"
    model: "claude-sonnet-4-6"
    api_key_env: "ANTHROPIC_API_KEY"
    timeout_seconds: 180
  - provider: "anthropic"
    model: "claude-opus-4-6"
    api_key_env: "ANTHROPIC_API_KEY"
    timeout_seconds: 180
  - provider: "anthropic"
    model: "claude-haiku-5-5"
    api_key_env: "ANTHROPIC_API_KEY"
    timeout_seconds: 180
  - provider: "anthropic"
    model: "claude-sonnet-5-5"
    api_key_env: "ANTHROPIC_API_KEY"
    timeout_seconds: 180
  - provider: "anthropic"
    model: "claude-opus-5-5"
    api_key_env: "ANTHROPIC_API_KEY"
    timeout_seconds: 180

  # ---------------------------------------------------------------------------
  # Google Gemini  (GEMINI_API_KEY)
  # ---------------------------------------------------------------------------
  - provider: "gemini"
    model: "gemini-3-flash-preview"
    api_key_env: "GEMINI_API_KEY"
    timeout_seconds: 180
  - provider: "gemini"
    model: "gemini-3.1-pro-preview"
    api_key_env: "GEMINI_API_KEY"
    timeout_seconds: 180
  - provider: "gemini"
    model: "gemini-3.8-flash"
    api_key_env: "GEMINI_API_KEY"
    timeout_seconds: 180
  - provider: "gemini"
    model: "gemini-4-argon"
    api_key_env: "GEMINI_API_KEY"
    timeout_seconds: 180

  # ---------------------------------------------------------------------------
  # xAI / Grok  (XAI_API_KEY)
  # ---------------------------------------------------------------------------
  # - provider: "xai"
  #   model: "grok-build-0.1"
  #   api_key_env: "XAI_API_KEY"
  #   timeout_seconds: 180
  - provider: "xai"
    model: "grok-4.3"
    api_key_env: "XAI_API_KEY"
    timeout_seconds: 180
  - provider: "xai"
    model: "grok-4.20-0309-non-reasoning"
    api_key_env: "XAI_API_KEY"
    timeout_seconds: 180
  - provider: "xai"
    model: "grok-4.7"
    api_key_env: "XAI_API_KEY"
    timeout_seconds: 180

  # ---------------------------------------------------------------------------
  # OpenAI  (OPENAI_API_KEY)
  # ---------------------------------------------------------------------------
  # - provider: "openai"
  #   model: "gpt-5.4-nano"
  #   api_key_env: "OPENAI_API_KEY"
  #   timeout_seconds: 180
  - provider: "openai"
    model: "gpt-6-luna"
    api_key_env: "OPENAI_API_KEY"
    timeout_seconds: 180
  - provider: "openai"
    model: "gpt-5.6-luna"
    api_key_env: "OPENAI_API_KEY"
    timeout_seconds: 180

  # ---------------------------------------------------------------------------
  # Mistral  (MISTRAL_API_KEY)
  # ---------------------------------------------------------------------------
  # - provider: "mistral"
  #   model: "mistral-small-2603"
  #   api_key_env: "MISTRAL_API_KEY"
  #   timeout_seconds: 180
  - provider: "mistral"
    model: "mistral-small-2603"
    api_key_env: "MISTRAL_API_KEY"
    timeout_seconds: 180

  # ---------------------------------------------------------------------------
  # Ollama  (local, no API key -- model must be pulled)
  # ---------------------------------------------------------------------------
  - provider: "ollama"
    model: "qwen3:8b"
    timeout_seconds: 300
  - provider: "ollama"
    model: "gemma4:e4b"
    timeout_seconds: 300
  - provider: "ollama"
    model: "gemma4:26b"
    timeout_seconds: 300
  - provider: "ollama"
    model: "gemma4:31b"
    timeout_seconds: 300
  # Models below are too slow for the 1h test timeout on this hardware:
