report_dir: "reports"

# Model IDs must match the rho/llm registry exactly (see rho/llm/registry.go).
#
# Fields:
#   provider:        rho/llm provider name (anthropic, gemini, xai, ollama, …)
#   model:           exact registry ID
#   api_key_env:     env var holding the API key — model is skipped if unset/empty
#   base_url:        optional endpoint override
#   timeout_seconds: per-request deadline (default: 120)

models:

  # ---------------------------------------------------------------------------
  # Anthropic  (ANTHROPIC_API_KEY)
  # ---------------------------------------------------------------------------
  # - provider: "anthropic"
  #   model: "claude-sonnet-4-5"
  #   api_key_env: "ANTHROPIC_API_KEY"
  # - provider: "anthropic"
  #   model: "claude-opus-4-5"
  #   api_key_env: "ANTHROPIC_API_KEY"
  - provider: "anthropic"
    model: "claude-haiku-4-5-20251001"
    api_key_env: "ANTHROPIC_API_KEY"
  - provider: "anthropic"
    model: "claude-sonnet-4-6"
    api_key_env: "ANTHROPIC_API_KEY"
  - provider: "anthropic"
    model: "claude-opus-4-6"
    api_key_env: "ANTHROPIC_API_KEY"
  - provider: "anthropic"
    model: "claude-haiku-5-5"
    api_key_env: "ANTHROPIC_API_KEY"
  - provider: "anthropic"
    model: "claude-sonnet-5-5"
    api_key_env: "ANTHROPIC_API_KEY"
  - provider: "anthropic"
    model: "claude-opus-5-5"
    api_key_env: "ANTHROPIC_API_KEY"

  # ---------------------------------------------------------------------------
  # Google Gemini  (GEMINI_API_KEY)
  # ---------------------------------------------------------------------------
  # - provider: "gemini"
  #   model: "gemini-2.5-flash"
  #   api_key_env: "GEMINI_API_KEY"
  # - provider: "gemini"
  #   model: "gemini-2.5-pro"
  #   api_key_env: "GEMINI_API_KEY"
  - provider: "gemini"
    model: "gemini-3-flash-preview"
    api_key_env: "GEMINI_API_KEY"
  - provider: "gemini"
    model: "gemini-3.1-pro-preview"
    api_key_env: "GEMINI_API_KEY"
  - provider: "gemini"
    model: "gemini-3.8-flash"
    api_key_env: "GEMINI_API_KEY"
  - provider: "gemini"
    model: "gemini-4-argon"
    api_key_env: "GEMINI_API_KEY"
  - provider: "gemini"
    model: "gemini-3.1-flash-lite"
    api_key_env: "GEMINI_API_KEY"

  # ---------------------------------------------------------------------------
  # xAI / Grok  (XAI_API_KEY)
  # ---------------------------------------------------------------------------
  # grok-3(-mini), grok-4-0709, grok-4(-1)-fast-* and grok-code-fast-1 are
  # retired: xAI answers them with grok-4.3 / grok-build-0.1 (2026-11-10).
  # - provider: "xai"
  #   model: "grok-4.6"
  #   api_key_env: "XAI_API_KEY"
  # - provider: "xai"
  #   model: "grok-4.5"
  #   api_key_env: "XAI_API_KEY"
  # - provider: "xai"
  #   model: "grok-4.20-0309-reasoning"
  #   api_key_env: "XAI_API_KEY"
  - provider: "xai"
    model: "grok-4.3"
    api_key_env: "XAI_API_KEY"
  - provider: "xai"
    model: "grok-4.20-0309-non-reasoning"
    api_key_env: "XAI_API_KEY"
  - provider: "xai"
    model: "grok-4.7"
    api_key_env: "XAI_API_KEY"
  - provider: "xai"
    model: "grok-build-0.1"
    api_key_env: "XAI_API_KEY"

  # ---------------------------------------------------------------------------
  # OpenAI  (OPENAI_API_KEY)
  # ---------------------------------------------------------------------------
  # - provider: "openai"
  #   model: "gpt-5.4-nano"
  #   api_key_env: "OPENAI_API_KEY"

  # ---------------------------------------------------------------------------
  # Groq  (GROQ_API_KEY)
  # ---------------------------------------------------------------------------
  # - provider: "groq"
  #   model: "llama-3.3-70b-versatile"
  #   api_key_env: "GROQ_API_KEY"

  # ---------------------------------------------------------------------------
  # Mistral  (MISTRAL_API_KEY)
  # ---------------------------------------------------------------------------
  # - provider: "mistral"
  #   model: "mistral-medium-latest"
  #   api_key_env: "MISTRAL_API_KEY"
  # - provider: "mistral"
  #   model: "codestral-2508"
  #   api_key_env: "MISTRAL_API_KEY"
  - provider: "mistral"
    model: "mistral-small-2603"
    api_key_env: "MISTRAL_API_KEY"
  - provider: "mistral"
    model: "mistral-large-4-0"
    api_key_env: "MISTRAL_API_KEY"

  # ---------------------------------------------------------------------------
  # Ollama  (local, no API key — model must be pulled)
  # ---------------------------------------------------------------------------
  - provider: "ollama"
    model: "qwen3:8b"
  # Not in the rho-llm registry (no capability metadata):
  # - provider: "ollama"
  #   model: "qwen3:14b"
  - provider: "ollama"
    model: "gemma4:e4b"
  - provider: "ollama"
    model: "gemma4:26b"
  - provider: "ollama"
    model: "gemma4:31b"
  - provider: "ollama"
    model: "gemma3:4b"
  - provider: "ollama"
    model: "gemma3:12b"
  - provider: "ollama"
    model: "gemma2:2b"
  # Not in the rho-llm registry (no capability metadata):
  # - provider: "ollama"
  #   model: "mistral:7b"
  # --- reasoning models (longer timeout) ---
  - provider: "ollama"
    model: "deepseek-r1:14b"
    timeout_seconds: 300
  # --- not pulled locally (uncomment when available) ---
  # - provider: "ollama"
  #   model: "qwen3:4b"
  # - provider: "ollama"
  #   model: "qwen3-coder:30b"
  # - provider: "ollama"
  #   model: "mistral-small3.2:24b"
  #   timeout_seconds: 300
